name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: source/server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: source/server/go.mod
          cache-dependency-path: source/server/go.sum

      - name: Run tests
        run: go test ./...

      - name: Build binary
        run: go build -ldflags "-X main.version=ci-${{ github.sha }}" -o bin/cercano ./cmd/cercano

  cli-e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: test/e2e
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: source/server/go.mod
          cache-dependency-path: |
            source/server/go.sum
            source/clients/cli/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: test/e2e/package-lock.json

      - name: Build cercano and cercano-cli
        run: ./scripts/build.sh

      - name: Install tui-test
        run: npm ci

      - name: Run terminal end-to-end tests
        run: npm test

      - name: Upload traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cli-e2e-traces
          path: test/e2e/artifacts/
          if-no-files-found: ignore
